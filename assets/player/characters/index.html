<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>RPG Prototype</title>

  <link rel="stylesheet" href="./css/style.css?v=70" />
</head>

<body>
  <canvas id="gameCanvas"></canvas>

  <!-- MENU PILIH KARAKTER -->
  <section id="characterSelect" class="character-select" hidden>
    <div class="character-panel">
      <p class="character-kicker">RPG PROTOTYPE</p>
      <h1>Pilih Karakter</h1>
      <p class="character-help">Pilih satu karakter untuk memulai permainan.</p>

      <div id="characterList" class="character-list"></div>

      <button id="startGameButton" class="start-game-button" type="button" disabled>
        PILIH KARAKTER DULU
      </button>
    </div>
  </section>

  <div id="mobileControls">
    <div id="moveJoystick" class="joystick move-joystick" aria-label="Joystick gerak">
      <div class="joystick-ring"></div>
      <div id="moveStick" class="joystick-stick"></div>
    </div>

    <div id="aimJoystick" class="joystick aim-joystick" aria-label="Joystick aim">
      <div class="joystick-ring"></div>
      <div id="aimStick" class="joystick-stick"></div>
    </div>

    <button
      id="mobilePauseButton"
      class="mobile-pause"
      type="button"
      aria-label="Pause"
    >
      II
    </button>

    <button
      id="mobileFireButton"
      class="mobile-fire"
      type="button"
      aria-label="Fire"
    >
      FIRE
    </button>
  </div>

  <script type="module" src="./js/main.js?v=70"></script>
</body>
</html>
