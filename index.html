<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>RPG Prototype</title>

  <!-- Ganti v setiap kali mau paksa CSS terbaru -->
  <link
    rel="stylesheet"
    href="./css/style.css?v=31"
  />
</head>

<body>

  <canvas id="gameCanvas"></canvas>

  <div id="mobileControls">

    <!-- JOYSTICK GERAK -->
    <div
      id="moveJoystick"
      class="joystick move-joystick"
    >
      <div class="joystick-ring"></div>
      <div
        id="moveStick"
        class="joystick-stick"
      ></div>
    </div>

    <!-- JOYSTICK AIM -->
    <div
      id="aimJoystick"
      class="joystick aim-joystick"
    >
      <div class="joystick-ring"></div>
      <div
        id="aimStick"
        class="joystick-stick"
      ></div>
    </div>

    <!-- PAUSE -->
    <button
      id="mobilePauseButton"
      class="mobile-pause"
      type="button"
      aria-label="Pause"
    >
      II
    </button>

    <!-- FIRE -->
    <button
      id="mobileFireButton"
      class="mobile-fire"
      type="button"
      aria-label="Fire"
    >
      FIRE
    </button>

  </div>

  <!-- Ganti v juga supaya JS terbaru dipaksa reload -->
  <script
    type="module"
    src="./js/main.js?v=31"
  ></script>

</body>
</html>
