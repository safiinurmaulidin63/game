<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>RPG Prototype</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Kontrol khusus HP -->
  <div id="mobileControls">

  <!-- JOYSTICK GERAK -->
  <div id="moveJoystick" class="joystick">
    <div class="joystick-ring"></div>
    <div id="moveStick" class="joystick-stick"></div>
  </div>

  <!-- JOYSTICK AIM -->
  <div id="aimJoystick" class="aim-joystick">
    <div class="joystick-ring"></div>
    <div id="aimStick" class="joystick-stick"></div>
  </div>

  <!-- PAUSE -->
  <button
    id="mobilePauseButton"
    class="mobile-pause"
    type="button"
  >
    II
  </button>

  <!-- FIRE -->
  <button
    id="mobileFireButton"
    class="mobile-fire"
    type="button"
  >
    FIRE
  </button>

</div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
